[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-voca-he"
version = "0.3.0"
description = "A 4.5M-parameter Hebrew text-to-speech model, a port of tiny-voca trained from scratch"
readme = "README.md"
authors = [{ name = "Idan Buzaglo" }, { name = "Muhammed Nazeem" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# renikud-plus is the default Hebrew front end (text -> IPA); its model downloads on first use.
dependencies = ["torch>=2.4,<3", "numpy>=1.24,<3", "soundfile>=0.12,<1", "renikud-plus>=0.6,<1"]

[project.optional-dependencies]
# The older phonikud front end (TINY_VOCA_FRONTEND=hebrew); he-v3 does not use it.
phonikud = ["phonikud==0.4.1", "phonikud-onnx>=1.0,<2"]
# ONNX export and running the exported model.
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
prepare = ["librosa>=0.10.2,<2", "pyarrow>=15", "huggingface-hub>=0.34,<2"]
# Annotation only: the pretrained phoneme recogniser used for forced alignment.
annotate = ["transformers>=4.40,<5", "torchaudio>=2.1,<3", "scipy>=1.10,<2", "huggingface-hub>=0.34,<2"]
# Evaluation only: ASR scoring and comparison with recordings.
evaluate = ["faster-whisper>=1.0,<2", "jiwer>=3,<5", "librosa>=0.10.2,<2", "scipy>=1.10,<2"]

[project.urls]
Repository = "https://github.com/buzagloidan/tiny-voca-he"
Upstream = "https://github.com/n4ze3m/tiny-voca"

[project.scripts]
tiny-voca-prepare = "tiny_voca.prepare:main"
tiny-voca-annotate = "tiny_voca.annotate:main"
tiny-voca-train = "tiny_voca.train:main"
tiny-voca-evaluate = "tiny_voca.evaluate:main"
tiny-voca-speak = "tiny_voca.infer:main"
tiny-voca-inspect = "tiny_voca.inspect:main"

[tool.setuptools.packages.find]
where = ["src"]
